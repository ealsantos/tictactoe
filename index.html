<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <link rel="stylesheet" href="styles.css">
<body>
    <div class="header">
    <h1>Tic Tac Toe</h1>
        <p>Enjoy the game!</p>
    </div>

    <input id="player1Name" type="text" placeholder="Player 1 Name">
    <input id="player2Name" type="text" placeholder="Player 2 Name">
    <button id="startGame" disabled>Start Game</button>
    <button id="resetGame" class="hidden">Reset Game</button>

    <div class="gameBoard">
    </div>

    <p id="firstTurnText"></p>

    <div class="results hidden">
        <h2>Results:</h2>
        <div id="player1Score"></div>
        <div id="player2Score"></div>
    </div>

    <dialog id="gameMessage">
    <p id="messageText"></p>
    <button id="closeMessage">Play Again</button>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
